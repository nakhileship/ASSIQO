version: '3.9'

# ──────────────────────────────────────────────────────────────────────────────
# ASSIQO – docker-compose
# Phase 1: postgres + backend only.
# Frontend service will be added in Phase 4.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: assiqo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       assiqo_db
      POSTGRES_USER:     assiqo_user
      POSTGRES_PASSWORD: assiqo_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run on first container creation (alphabetical order: schema → seed)
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assiqo_user -d assiqo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node/Express backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assiqo_backend
    restart: unless-stopped
    environment:
      PORT:         5000
      DATABASE_URL: postgresql://assiqo_user:assiqo_pass@db:5432/assiqo_db
      JWT_SECRET:   dev_jwt_secret_replace_in_production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN:  http://localhost:3000,http://localhost:5173
      NODE_ENV:     development
    ports:
      - "5000:5000"
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy
    # Hot-reload in dev: mount source, override CMD to use nodemon
    volumes:
      - ./backend:/app
      - /app/node_modules    # keep container's node_modules, don't overwrite with host

  # ── Frontend (Vite build + Nginx, exposed on 3000) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: assiqo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
